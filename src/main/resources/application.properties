# ===================== Application =====================
spring.application.name=campus-placement-system
server.port=8080

# ===================== MySQL Database Connection =====================
# DB credentials are read from environment variables - never hardcode secrets.
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your shell / CI / deployment env.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_placement_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===================== JPA / Hibernate =====================
# ddl-auto=update -> Hibernate creates/alters tables to match your @Entity classes
# (fine for development; use ddl-auto=validate + Flyway migrations for production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# SQL logging is in application-dev.properties only (not here, to keep prod logs clean)

# ===================== JWT =====================
# Read secret from environment variable - never commit the real value.
# Set JWT_SECRET to a random 256-bit+ base64 string in your environment.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

# ===================== File Upload (Resumes) =====================
# Set CLOUDINARY_URL in your environment variables.
# Format: cloudinary://<api_key>:<api_secret>@<cloud_name>
cloudinary.url=${CLOUDINARY_URL:cloudinary://dummy:dummy@dummy}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
