<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Create a Campus Placement System student account to apply for placement drives.">
  <title>Register - Campus Placement System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card shadow p-4">
      <div class="card-body">
        <h1 class="h3 text-center mb-1">Create Student Account</h1>
        <p class="text-center text-muted mb-4">Register to view and apply for placement drives</p>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="fullName">Full name</label>
            <input type="text" class="form-control" id="fullName"
                   autocomplete="name" minlength="2" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email"
                   autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password"
                   autocomplete="new-password" minlength="8" required>
            <div class="form-text">At least 8 characters with one uppercase, lowercase, and digit</div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="registerBtn">Create account</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Already have an account? <a href="/login.html">Login here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const data = await apiFetch('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            fullName: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            role: 'STUDENT',
          }),
        });
        saveSession(data);
        showToast(`Account created! Welcome, ${escHtml(data.fullName)}.`, 'success');
        setTimeout(() => redirectToDashboard(data.role), 600);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
