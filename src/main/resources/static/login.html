<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- L-2: SEO meta description -->
  <meta name="description" content="Campus Placement System — Sign in to access your student or admin (placement cell) dashboard.">
  <title>Login - Campus Placement System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- L-8: Subresource Integrity (SRI) hashes prevent CDN tampering -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card shadow p-4">
      <div class="card-body">
        <h1 class="h3 text-center mb-1">College Placement</h1>
        <p class="text-center text-muted mb-4">Sign in to your account</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <!-- L-3: for attribute links label to input for screen readers -->
            <label class="form-label" for="email">Email address</label>
            <input type="email" class="form-control" id="email" autocomplete="email" required
                   aria-describedby="emailHelp">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
        </form>

        <p class="text-center mt-3 mb-0">
          Don't have an account? <a href="/register.html">Register here</a>
        </p>
      </div>
    </div>
  </div>

  <!-- L-8: Bootstrap JS with SRI -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        saveSession(data);
        showToast(`Welcome back, ${escHtml(data.fullName)}!`, 'success');
        setTimeout(() => redirectToDashboard(data.role), 600);
      } catch (err) {
        showToast(err.message, 'danger');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
